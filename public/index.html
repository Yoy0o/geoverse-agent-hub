<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agent 工作台 · agent-hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230B6E66%22/%3E%3Cpath d=%22M9 11h14M9 16h14M9 21h9%22 stroke=%22white%22 stroke-width=%222.6%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#E8EEEC; --line:#D3DDDA; --line-2:#BFCCC8;
  --ink:#12201C; --ink-2:#34443F; --muted:#5E706B;
  --accent:#0B6E66; --accent-ink:#FFFFFF; --accent-soft:#DCEFEB;
  --warn:#A86400; --warn-soft:#FAEBD2;
  --ok:#2C7A39; --ok-soft:#DFF1E2; --bad:#B42318; --bad-soft:#FBE3E0;
  --shadow:0 12px 40px rgba(18,32,28,.18);
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1412; --surface:#141D1B; --surface-2:#1B2624; --line:#2A3834; --line-2:#3A4B46;
    --ink:#E3ECE9; --ink-2:#C0CDC9; --muted:#8C9E99;
    --accent:#4DC1B4; --accent-ink:#06201D; --accent-soft:#15322E;
    --warn:#E6A548; --warn-soft:#392A12;
    --ok:#62BD70; --ok-soft:#16301B; --bad:#F07A6F; --bad-soft:#3A1A17;
    --shadow:0 12px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#141D1B; --surface-2:#1B2624; --line:#2A3834; --line-2:#3A4B46;
  --ink:#E3ECE9; --ink-2:#C0CDC9; --muted:#8C9E99;
  --accent:#4DC1B4; --accent-ink:#06201D; --accent-soft:#15322E;
  --warn:#E6A548; --warn-soft:#392A12;
  --ok:#62BD70; --ok-soft:#16301B; --bad:#F07A6F; --bad-soft:#3A1A17;
  --shadow:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-size:13px}
.feed li{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;align-items:baseline;padding:4px 0;border-bottom:1px dashed var(--line)}
.feed li:last-child{border-bottom:0}
.feed .tm{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.feed .sm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line-2);margin-right:4px}
.dot.on{background:var(--ok)} .dot.warm{background:var(--warn)}
code.cmd{display:block;white-space:pre-wrap;word-break:break-all;font-family:var(--mono);font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;padding-inline:0;padding-block:0 48px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* top bar */
.bar{padding-block:18px 10px}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.01em}
.brand span{font-size:13px;color:var(--muted)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-family:var(--mono)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.on i{background:var(--ok)} .sync.off i{background:var(--warn)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:10px 12px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--mono);font-size:11px;padding:0 6px;border-radius:999px;background:var(--bad-soft);color:var(--bad);line-height:1.6}
.banner{margin:12px 0 0;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--ink);font-size:13px}
main{padding-top:16px}

/* layout */
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:900px){.grid2{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.stack{display:grid;gap:14px;align-content:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.panel h2{margin:0 0 10px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{font-weight:400;font-size:12px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.empty{padding:18px 8px;text-align:center;color:var(--muted);font-size:13px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:last-child:nth-child(odd){grid-column:1/-1}}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.kpi .s{font-size:11px;color:var(--muted);font-family:var(--mono)}

/* attention list */
.alist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.aitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);cursor:pointer;text-align:left;width:100%}
.aitem:hover{border-color:var(--line-2)}
.aitem .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aitem .m{font-size:12px;color:var(--muted)}
.stripe{width:4px;align-self:stretch;border-radius:2px;background:var(--muted)}
.stripe.bad{background:var(--bad)} .stripe.warn{background:var(--warn)} .stripe.acc{background:var(--accent)}

/* pills */
.pill{display:inline-block;font-size:12px;font-weight:500;padding:0 8px;border-radius:999px;line-height:1.75;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill.mono{font-size:11px;font-weight:600}
.st-待规格,.st-待执行{background:var(--surface-2);color:var(--ink-2)}
.st-执行中{background:var(--accent-soft);color:var(--accent)}
.st-需介入{background:var(--bad-soft);color:var(--bad)}
.st-待评审{background:var(--warn-soft);color:var(--warn)}
.st-已合并{background:var(--ok-soft);color:var(--ok)}
.st-已放弃{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.rk-L1{background:var(--ok-soft);color:var(--ok)} .rk-L2{background:var(--accent-soft);color:var(--accent)}
.rk-L3{background:var(--warn-soft);color:var(--warn)} .rk-L4{background:var(--bad-soft);color:var(--bad)}
.tagx{background:transparent;border:1px dashed var(--line-2);color:var(--muted)}

/* bars */
.bars{display:grid;gap:7px}
.brow{display:grid;grid-template-columns:96px minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:13px}
.brow .b{height:10px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.brow .b i{display:block;height:100%;background:var(--warn);border-radius:3px}
.brow .n{text-align:right;font-family:var(--mono);font-size:12px}

/* tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}

/* board */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters select,.filters input[type="search"]{width:auto;min-width:0;max-width:100%}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
@media (max-width:640px){.board{grid-auto-columns:80%}}
.col{background:var(--surface-2);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start;scroll-snap-align:start;min-height:120px}
.col h3{margin:0 2px 2px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.col h3 .mono{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--line-2)}
.card .id{font-family:var(--mono);font-size:11px;color:var(--muted)}
.card .t{font-weight:500;line-height:1.45}
.card .m{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px;color:var(--muted)}
.card.hot{border-color:var(--bad)}

/* forms */
.form{display:grid;gap:12px}
.row{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px){.row.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.row.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.row.c4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.f{display:grid;gap:4px;font-size:13px;color:var(--ink-2);min-width:0}
.f > span{font-weight:500}
input[type="text"],input[type="number"],input[type="search"],input[type="url"],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;min-width:0}
textarea{resize:vertical;min-height:72px;line-height:1.55}
textarea.code,pre.code{font-family:var(--mono);font-size:12.5px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg label{display:flex;align-items:center;cursor:pointer;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{padding:6px 12px;font-size:13px;font-family:var(--mono);border-right:1px solid var(--line)}
.seg label:last-child span{border-right:0}
.seg input:checked + span{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:-2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{appearance:none;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.pri:hover{filter:brightness(1.07)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:8px}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
pre.code{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;white-space:pre;margin:0}
details.more{border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;font-size:14px;font-weight:500}

/* rules */
.rule{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule .tx{font-size:14px}
.rule .m{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}

/* drawer */
.backdrop{position:fixed;inset:0;background:rgba(10,20,18,.38);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column}
.dh{padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.dh .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dh input.title{font-size:17px;font-weight:700;border-color:transparent;background:transparent;padding-inline:4px}
.dh input.title:hover{border-color:var(--line)}
.db{overflow-y:auto;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 24px);display:grid;gap:18px}
.sec h4{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--ink-2)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 14px;font-size:13px}
.meta div span{display:block;color:var(--muted);font-size:12px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.checks li{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.checks input{margin-top:5px}
.vlist{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13px}
.vlist li{display:flex;gap:8px;align-items:baseline}
.ok{color:var(--ok)} .bad{color:var(--bad)}
.hist{list-style:none;margin:0;padding:0;font-size:12px;color:var(--muted);display:grid;gap:2px;font-family:var(--mono)}
.review{border:1px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:12px;display:grid;gap:10px}

/* toast & modal */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:40;max-width:calc(100% - 32px)}
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(10,20,18,.38)}
.modal .box{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(640px,100%);max-height:88vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
.modal .box > header{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700}
.modal .box > div{padding:14px 16px;overflow:auto}
.modal .box > footer{padding:12px 16px;border-top:1px solid var(--line)}
.modal textarea{min-height:240px}
.stream{white-space:pre-wrap;font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;min-height:80px}
/* hub identity & header chips */
.hubtag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px 2px 7px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);white-space:nowrap}
.hubtag svg{width:14px;height:14px}
.hubtag.cloud{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chipbtn{appearance:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink-2);cursor:pointer;white-space:nowrap;font-family:var(--mono)}
.chipbtn:hover{border-color:var(--line-2)}
.chipbtn i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chipbtn.ok i{background:var(--ok)} .chipbtn.warn i{background:var(--warn)} .chipbtn.bad i{background:var(--bad)}
.chipbtn.bad{color:var(--bad);border-color:var(--bad)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface);color:var(--ink-2)}
@media (max-width:640px){.brand span.sub{display:none}.bar{padding-block:12px 6px}.bar .hide-sm{display:none}}

/* execution */
.loc{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.loc svg{width:14px;height:14px;flex:none}
.loc.cloud{color:var(--accent)}
.prog{display:block;height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;min-width:60px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
.prog.ok i{background:var(--ok)} .prog.warn i{background:var(--warn)} .prog.bad i{background:var(--bad)}
.prog.ind i{width:35%!important;animation:ind 1.6s ease-in-out infinite}
@keyframes ind{0%{transform:translateX(-100%)}100%{transform:translateX(290%)}}
.h-running,.h-claimed,.h-ready{background:var(--accent-soft);color:var(--accent)}
.h-queued,.h-waiting{background:var(--surface-2);color:var(--ink-2)}
.h-stalled,.h-blocked{background:var(--warn-soft);color:var(--warn)}
.h-lost,.h-failed{background:var(--bad-soft);color:var(--bad)}
.h-done{background:var(--ok-soft);color:var(--ok)}
.h-cancelled,.h-superseded{background:var(--surface-2);color:var(--muted)}
.cardexec{display:grid;gap:4px;padding-top:6px;border-top:1px dashed var(--line)}
.cardexec .row1{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.cardexec .row1 .loc{min-width:0;overflow:hidden;text-overflow:ellipsis}
.cardexec .row1 .pill{flex:none;font-size:11px}
.cardexec .step{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.warm{border-color:var(--warn)}
.runs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.runrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.runrow.warm{border-color:var(--warn)} .runrow.hot{border-color:var(--bad)}
.runrow .t{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink)}
.runrow .t:hover{color:var(--accent)}
.runrow .m{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12px;color:var(--muted)}
.runrow .p{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12px}
.runrow .p .s{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.runners{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.runner{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px;background:var(--bg)}
.runner.off{opacity:.72}
.runner .n{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.runner .m{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px}
.execbox{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;background:var(--bg)}
.execbox.warm{border-color:var(--warn);background:var(--warn-soft)}
.execbox .top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px}
.dispatch{border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:12px;display:grid;gap:10px}
.attempts{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:12px}
.attempts li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;color:var(--muted)}
.syncbox{display:grid;gap:10px}
.syncbox .meta div{min-width:0;overflow:hidden;text-overflow:ellipsis}
.conflicts{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}

</head><body>
<header class="bar"><div class="wrap">
  <div class="brand"><h1>Agent 工作台</h1><span id="hubtag"></span><span class="sub">多 Agent 任务 · 执行 · 评审 · 规则沉淀</span></div>
  <span class="btns"><span class="sync" id="sync" title="与这台 Hub 的实时连接"><i></i><span>连接中…</span></span><span id="syncchip"></span><button class="btn pri sm" data-act="new-task" title="新建任务（快捷键 N）">新建任务</button><button class="btn ghost sm" data-act="shortcuts" title="快捷键（?）" aria-label="快捷键">?</button><button class="btn ghost sm" data-act="logout" title="退出登录">退出</button></span>
</div></header>
<nav class="tabs" aria-label="视图"><div class="wrap" role="tablist" id="tabs"></div></nav>
<div class="wrap"><div id="banner"></div><main id="view" aria-live="polite"></main></div>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>

<script src="/vendor/jszip.min.js"></script>
<script src="/shim.js"></script>
<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const STATUSES = ["待规格","待执行","执行中","需介入","待评审","已合并","已放弃"];
const OPEN = ["待规格","待执行","执行中","需介入","待评审"];
const RISKS = ["L1","L2","L3","L4"];
const RISK_TIP = {L1:"机械型：依赖升级、lint 修复、配置、迁移",L2:"常规型：小功能、缺陷修复、补测试",L3:"复杂型：跨模块、核心逻辑",L4:"高风险：鉴权、资金、数据删除、对外契约"};
const REASONS = ["规格不清","上下文缺失","越界改动","验证不足","设计问题","代码质量","安全隐患","Agent 能力不足"];
const TARGETS = ["AGENTS.md","CLAUDE.md",".cursor/rules","评审清单","验证脚本","任务单模板"];
const DEFAULT_AGENTS = ["Claude Code","Cowork","Codex","Cursor","Copilot","Kiro","Gemini CLI"];
const TABS = [["today","今日"],["board","看板"],["exec","执行"],["projects","项目"],["agents","接入"],["capture","录入"],["rules","规则库"],["retro","复盘"],["export","同步与设置"]];
const NEXT = {
  "待规格":[["待执行","规格就绪"]],
  "待执行":[["执行中","开始执行"]],
  "执行中":[["待评审","提交评审"],["需介入","需要介入"]],
  "需介入":[["执行中","已处理，继续"],["已放弃","放弃"]],
  "待评审":[["__merge","评审通过并合并"],["__rework","退回修改"],["已放弃","放弃"]],
  "已合并":[],"已放弃":[["待执行","重新打开"]]
};

/* ---------- state ---------- */
const S = {
  tab: "today", tasks: [], rules: [], retros: {}, config: {agents: DEFAULT_AGENTS.slice(), projects: []},
  mode: "loading", openId: null, reviewMode: null, weekOffset: 0,
  filter: {project: "", agent: "", q: "", closed: false},
  loaded: {tasks:false, rules:false, retros:false, config:false},
  cap: {db:null, downloads:null, sample:null},
  hub: {caps:null, status:null, feed:[], activity:{}, online:true},
  exec: {runners:new Map(), runs:new Map(), loaded:false}, sync:null, syncPreview:null, syncBusy:"", dispatch:null
};
const AI = () => (S.hub.caps && S.hub.caps.llm && S.hub.caps.llm.provider==="anthropic") ? "Claude" : "AI";
try { const t = localStorage.getItem("awb.tab"); if (t && TABS.some(x=>x[0]===t)) S.tab = t; } catch(e){}

/* ---------- utils ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(String(u||"").trim()) ? String(u).trim() : "";
const nowIso = () => new Date().toISOString();
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : null; };
const rid = n => Math.random().toString(36).slice(2, 2+n);
function newTaskId(){ const d=new Date(); const p=x=>String(x).padStart(2,"0"); return "T"+String(d.getFullYear()).slice(2)+p(d.getMonth()+1)+p(d.getDate())+"-"+rid(3); }
function ago(iso){ if(!iso) return ""; const ms=Date.now()-new Date(iso).getTime(); if(!Number.isFinite(ms)) return ""; const m=Math.round(ms/60000); if(m<1) return "刚刚"; if(m<60) return m+" 分钟前"; const h=Math.round(m/60); if(h<48) return h+" 小时前"; return Math.round(h/24)+" 天前"; }
function dur(ms){ if(ms==null||!Number.isFinite(ms)||ms<0) return "—"; const m=Math.round(ms/60000); if(m<60) return m+" 分"; const h=m/60; if(h<48) return h.toFixed(1)+" 时"; return (h/24).toFixed(1)+" 天"; }
function fmtDate(iso){ if(!iso) return "—"; const d=new Date(iso); if(isNaN(d)) return "—"; const p=x=>String(x).padStart(2,"0"); return (d.getMonth()+1)+"/"+d.getDate()+" "+p(d.getHours())+":"+p(d.getMinutes()); }
function money(v){ return v==null ? "—" : "¥"+(Math.round(v*10)/10).toLocaleString("zh-CN"); }
function pct(a,b){ return b ? Math.round(a*100/b)+"%" : "—"; }
function isoWeek(date){ const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())); const day=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-day); const y=d.getUTCFullYear(); const w=Math.ceil(((d-Date.UTC(y,0,1))/86400000+1)/7); return y+"-W"+String(w).padStart(2,"0"); }
function weekRange(offset){ const n=new Date(); const day=(n.getDay()+6)%7; const s=new Date(n.getFullYear(),n.getMonth(),n.getDate()-day+offset*7); const e=new Date(s); e.setDate(s.getDate()+7); return {start:s,end:e,key:isoWeek(s)}; }
function lastEntered(t, status){ const h=(t.history||[]).filter(x=>x.to===status); return h.length ? h[h.length-1].at : null; }
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>{el.hidden=true;},2600); }
function fileSafe(s){ return String(s||"").replace(/[\\/:*?"<>|#^\[\]]/g,"-").replace(/\s+/g," ").trim().slice(0,80) || "untitled"; }

/* ---------- store (db or local memory) ---------- */
const queues = {};
// 同一文档的写入排队执行。失败时提示一次并继续以失败结束，调用方后续的“已保存”提示不会执行；队列本身不中断
function enqueue(path, fn){
  const p = (queues[path] || Promise.resolve()).then(fn).catch(err => { reportErr(err); throw Object.assign(err || new Error("failed"), {reported:true}); });
  queues[path] = p.catch(() => {}); return p;
}
window.addEventListener("unhandledrejection", e => { if (e.reason && e.reason.reported) e.preventDefault(); });
function reportErr(err){
  const code = err && err.code;
  if (code === "quota_exceeded") toast("存储已满：请先删除一些旧任务或规则");
  else if (code === "invalid_argument") { toast("没有写入权限或数据格式不合法"); }
  else if (code === "resource_exhausted") toast("操作太频繁，请稍后再试");
  else if (code === "revoked") { S.mode="local"; renderSync(); toast("数据连接已断开"); }
  else if (code === "retired") toast(err.message || "本 Hub 已停用（只读）");
  else toast("保存失败，请重试");
}
function coll(name){ return name==="tasks"?S.tasks:name==="rules"?S.rules:null; }
function localPut(name, id, data){ if(name==="retros"){ S.retros[id]=Object.assign({id},data); return; } if(name==="config"){ S.config=Object.assign({},S.config,data); return; } const arr=coll(name); const i=arr.findIndex(x=>x.id===id); const doc=Object.assign({id},data); if(i>=0) arr[i]=doc; else arr.push(doc); }
function localMerge(name, id, patch){ if(name==="retros"){ S.retros[id]=Object.assign({},S.retros[id]||{id},patch); return; } if(name==="config"){ S.config=Object.assign({},S.config,patch); return; } const arr=coll(name); const i=arr.findIndex(x=>x.id===id); if(i>=0) arr[i]=Object.assign({},arr[i],patch); }
function localDel(name, id){ if(name==="retros"){ delete S.retros[id]; return; } const arr=coll(name); const i=arr.findIndex(x=>x.id===id); if(i>=0) arr.splice(i,1); }
const store = {
  set(name, id, data){
    const body = Object.assign({}, data); delete body.id;
    if (S.mode !== "db") { localPut(name, id, body); render(); return Promise.resolve(); }
    return enqueue(name+"/"+id, () => S.cap.db.doc(name+"/"+id).set(body));
  },
  update(name, id, patch){
    if (S.mode !== "db") { localMerge(name, id, patch); render(); return Promise.resolve(); }
    return enqueue(name+"/"+id, () => S.cap.db.doc(name+"/"+id).update(patch));
  },
  del(name, id){
    if (S.mode !== "db") { localDel(name, id); render(); return Promise.resolve(); }
    return enqueue(name+"/"+id, () => S.cap.db.doc(name+"/"+id).delete());
  }
};
function getTask(id){ return S.tasks.find(t=>t.id===id); }
function patchTask(id, patch){ patch.updatedAt = nowIso(); return store.update("tasks", id, patch); }
function moveTask(t, to, extra){
  const at = nowIso();
  const patch = Object.assign({status: to, history: (t.history||[]).concat([{at, from: t.status, to}]).slice(-40)}, extra||{});
  if (to === "执行中" && !t.startedAt) patch.startedAt = at;
  if (to === "已合并" || to === "已放弃") patch.doneAt = at; else if (t.doneAt) patch.doneAt = null;
  return patchTask(t.id, patch);
}
function saveConfig(patch){ return store.set("config","main", Object.assign({}, {agents:S.config.agents, projects:S.config.projects}, patch)); }
/* ---------- metrics ---------- */
function inRange(iso, s, e){ if(!iso) return false; const t=new Date(iso).getTime(); return t>=s.getTime() && t<e.getTime(); }
function metrics(tasks, s, e){
  const created = tasks.filter(t=>inRange(t.createdAt,s,e));
  const finished = tasks.filter(t=>inRange(t.doneAt,s,e) && (t.status==="已合并"||t.status==="已放弃"));
  const merged = finished.filter(t=>t.status==="已合并");
  const dropped = finished.filter(t=>t.status==="已放弃");
  const firstPass = merged.filter(t=>!(t.reworks||[]).length);
  const cost = finished.reduce((a,t)=>a+(num(t.cost)||0),0);
  const cycles = merged.map(t=>new Date(t.doneAt)-new Date(t.startedAt||t.createdAt)).filter(x=>Number.isFinite(x)&&x>=0);
  const reasons = {};
  const bump = r => { reasons[r]=(reasons[r]||0)+1; };
  tasks.forEach(t=>{
    (t.reworks||[]).forEach(r=>{ if(inRange(r.at,s,e)) (r.reasons||[]).forEach(bump); });
    if (t.review && inRange(t.review.at,s,e)) (t.review.reasons||[]).forEach(bump);
    if (t.status==="已放弃" && inRange(t.doneAt,s,e) && t.dropReason) bump(t.dropReason);
  });
  return { created, finished, merged, dropped, firstPass, cost,
    avgCycle: cycles.length ? cycles.reduce((a,b)=>a+b,0)/cycles.length : null,
    costPerMerged: merged.length ? cost/merged.length : null,
    reasons: Object.entries(reasons).sort((a,b)=>b[1]-a[1]) };
}
function agentStats(tasks, days){
  const since = Date.now()-days*86400000; const by = {};
  tasks.forEach(t=>{
    const a = t.agent || "未指定"; const o = by[a] || (by[a]={agent:a,total:0,fin:0,merged:0,first:0,cost:0,costN:0,mins:0,minsN:0,rework:0});
    if (new Date(t.createdAt).getTime() >= since) o.total++;
    if (t.doneAt && new Date(t.doneAt).getTime() >= since){
      o.fin++; if (t.status==="已合并"){ o.merged++; if(!(t.reworks||[]).length) o.first++; }
      if (num(t.cost)!=null){ o.cost+=num(t.cost); o.costN++; }
      if (num(t.minutes)!=null){ o.mins+=num(t.minutes); o.minsN++; }
    }
    if (new Date(t.createdAt).getTime() >= since) o.rework += (t.reworks||[]).length;
  });
  return Object.values(by).filter(o=>o.total||o.fin).sort((a,b)=>b.total-a.total);
}
function attention(){
  const items = [];
  S.tasks.forEach(t=>{
    if (t.status==="需介入") items.push({t, lvl:"bad", pri:0, note:"需介入 · "+(ago(lastEntered(t,"需介入")||t.updatedAt)||"")});
    else if (t.status==="待评审"){ const w = Date.now()-new Date(lastEntered(t,"待评审")||t.updatedAt||t.createdAt); items.push({t, lvl:"warn", pri:1, wait:w, note:"待评审 · 已等待 "+dur(w)}); }
    else {
      const r = OPEN.includes(t.status) ? execOf(t) : null;
      if (r && (r.health==="stalled" || r.health==="lost")) items.push({t, lvl: r.health==="lost" ? "bad" : "warn", pri:2, note:(r.health==="lost" ? "执行端离线，执行失联" : "执行停滞 · "+beat(r))+" · "+whereText(r)});
      else if (r && (r.health==="waiting" || (r.health==="queued" && Date.now()-Date.parse(r.createdAt||r.at) > 30*60000))) items.push({t, lvl:"acc", pri:3, note:(r.mode==="handoff" ? "等待云端 Agent 接手" : "派发后还没有执行端领取")+" · "+ago(r.createdAt||r.at)});
      else if (t.status==="执行中" && num(t.budgetMin) && t.startedAt){ const run=(Date.now()-new Date(t.startedAt))/60000; if(run>num(t.budgetMin)) items.push({t, lvl:"acc", pri:4, note:"超出时长预算 · 已运行 "+dur(run*60000)+" / 预算 "+t.budgetMin+" 分"}); }
    }
  });
  return items.sort((a,b)=>a.pri-b.pri || (b.wait||0)-(a.wait||0));
}

/* ---------- render framework ---------- */
let lastKey = "";
function render(){
  renderTabs(); renderSync(); renderBanner();
  const key = S.tab + "|" + (S.openId||"") + "|" + (S.reviewMode||"");
  const preserve = key === lastKey; lastKey = key;
  withPreserved($("#view"), preserve, () => { $("#view").innerHTML = VIEWS[S.tab](); });
  withPreserved($("#layer"), preserve, () => { $("#layer").innerHTML = S.openId && getTask(S.openId) ? drawerHtml(getTask(S.openId)) : ""; });
}
function withPreserved(root, preserve, fn){
  if (!preserve) { fn(); return; }
  const vals = {};
  $$("input[id],textarea[id],select[id]", root).forEach(el => { vals[el.id] = (el.type==="checkbox"||el.type==="radio") ? {c:el.checked} : {v:el.value}; });
  const a = document.activeElement; const act = a && root.contains(a) && a.id ? a.id : null;
  let sel = null; try { if (act && a.selectionStart!=null) sel = [a.selectionStart, a.selectionEnd]; } catch(e){}
  const scrollers = $$("[data-keep-scroll]", root).map(el=>[el.dataset.keepScroll, el.scrollTop, el.scrollLeft]);
  const opened = $$("details", root).map(el=>el.open);
  fn();
  const ds = $$("details", root); if (ds.length === opened.length) ds.forEach((el,i)=>{ el.open = opened[i]; });
  Object.entries(vals).forEach(([id,s]) => { const el = document.getElementById(id); if (!el || !root.contains(el)) return; if ("c" in s) el.checked = s.c; else if (el.value !== s.v) el.value = s.v; });
  scrollers.forEach(([k,t,l])=>{ const el=root.querySelector('[data-keep-scroll="'+k+'"]'); if(el){ el.scrollTop=t; el.scrollLeft=l; } });
  if (act) { const el = document.getElementById(act); if (el) { el.focus({preventScroll:true}); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch(e){} } }
}
function renderTabs(){
  const need = S.tasks.filter(t=>t.status==="需介入"||t.status==="待评审").length;
  const pendingRules = S.rules.filter(r=>r.status==="待写入").length;
  $("#tabs").innerHTML = TABS.map(([k,l]) => {
    const c = k==="today" && need ? '<span class="cnt">'+need+'</span>' : k==="rules" && pendingRules ? '<span class="cnt">'+pendingRules+'</span>' : k==="exec" ? execCount() : "";
    return '<button class="tab" role="tab" id="tab-'+k+'" data-act="tab" data-k="'+k+'" aria-selected="'+(S.tab===k)+'">'+l+c+'</button>';
  }).join("");
}
function renderSync(){
  const el = $("#sync");
  const on = S.mode==="db" && S.hub.online;
  el.className = "sync " + (on ? "on" : S.mode==="loading" ? "" : "off");
  el.lastElementChild.textContent = S.mode==="db" ? (S.hub.online ? "已连接" : "重连中…") : S.mode==="local" ? "未连接" : "连接中…";
  renderHub();
}
function execCount(){
  const act = activeRuns(); const bad = act.filter(hot).length + remoteRuns().filter(hot).length;
  return bad ? '<span class="cnt">'+bad+'</span>' : act.length ? '<span class="cnt" style="background:var(--accent-soft);color:var(--accent)">'+act.length+'</span>' : "";
}
function renderBanner(){
  const to = S.hub.caps && S.hub.caps.hub && safeUrl(S.hub.caps.hub.retiredTo);
  if (to){ const html = '<div class="banner"><b>本 Hub 已停用（只读）</b>：任务、评审和派发都在 <a href="'+esc(to)+'" target="_blank" rel="noopener noreferrer">云端 Hub</a> 上进行。这里保留的是停用时的数据'+(S.sync&&S.sync.configured?'，并按同步设置继续从云端更新':'')+'；在这里的修改不会保存。</div>'; if ($("#banner").innerHTML !== html) $("#banner").innerHTML = html; return; }
  $("#banner").innerHTML = S.mode==="local" ? '<div class="banner">没有连接到 agent-hub：请登录后刷新页面。改动只保留在本次打开的页面里。</div>' : (!S.hub.online ? '<div class="banner">与 agent-hub 的实时连接中断，正在重连…</div>' : "");
}

/* ---------- small html helpers ---------- */
const rulePill = s => '<span class="pill '+(s==="已写入"?"st-已合并":s==="已废弃"?"st-已放弃":"st-待评审")+'">'+esc(s)+'</span>';
const stPill = s => '<span class="pill st-'+esc(s)+'">'+esc(s)+'</span>';
const rkPill = r => r ? '<span class="pill mono rk-'+esc(r)+'" title="'+esc(RISK_TIP[r]||"")+'">'+esc(r)+'</span>' : "";
const opt = (v, cur, label) => '<option value="'+esc(v)+'"'+(v===cur?" selected":"")+'>'+esc(label==null?v:label)+'</option>';
function projectOptions(cur, withAll){ const ps = S.config.projects.map(p=>p.name); if (cur && !ps.includes(cur)) ps.push(cur); return (withAll?opt("",cur,"全部项目"):opt("",cur,"未指定"))+ps.map(p=>opt(p,cur)).join(""); }
function agentOptions(cur, withAll){ const as = S.config.agents.slice(); if (cur && !as.includes(cur)) as.push(cur); return (withAll?opt("",cur,"全部 Agent"):opt("",cur,"未指定"))+as.map(a=>opt(a,cur)).join(""); }
function sampleBadge(t){ return t.sample ? '<span class="pill tagx">示例</span>' : ""; }

/* ---------- view: today ---------- */
function viewToday(){
  if (!S.loaded.tasks && S.mode==="loading") return '<div class="empty">正在加载…</div>';
  const now = new Date(); const s = new Date(now.getTime()-7*86400000);
  const m = metrics(S.tasks, s, new Date(now.getTime()+1));
  const att = attention();
  const pendingRules = S.rules.filter(r=>r.status==="待写入");
  const running = S.tasks.filter(t=>t.status==="执行中").length;
  const openN = S.tasks.filter(t=>OPEN.includes(t.status)).length;
  const kp = [
    ["进行中任务", openN, "其中执行中 "+running],
    ["近 7 天新建", m.created.length, "任务"],
    ["近 7 天合并", m.merged.length, "放弃 "+m.dropped.length],
    ["合并率", pct(m.merged.length, m.finished.length), "已结束 "+m.finished.length],
    ["一次通过率", pct(m.firstPass.length, m.merged.length), "未经退回即合并"],
    ["每合并成本", money(m.costPerMerged), "平均周期 "+dur(m.avgCycle)]
  ];
  const attHtml = (att.length || pendingRules.length) ? '<ul class="alist">' +
    att.map(x=>'<li><button class="aitem" data-act="open" data-id="'+esc(x.t.id)+'"><span class="stripe '+x.lvl+'"></span><span style="min-width:0"><div class="t">'+esc(x.t.title||"(未命名)")+'</div><div class="m">'+esc(x.note)+' · '+esc(x.t.agent||"未指定 Agent")+(x.t.project?' · '+esc(x.t.project):'')+'</div></span>'+rkPill(x.t.risk)+'</button></li>').join("") +
    (pendingRules.length ? '<li><button class="aitem" data-act="tab" data-k="rules"><span class="stripe"></span><span><div class="t">'+pendingRules.length+' 条规则等待写入规则文件</div><div class="m">写进 AGENTS.md 等文件后，在规则库里标记为已写入</div></span><span class="pill">规则库</span></button></li>' : "") +
    '</ul>' : '<div class="empty">没有需要你处理的事项。</div>';
  const maxR = m.reasons.length ? m.reasons[0][1] : 1;
  const reasonsHtml = m.reasons.length ? '<div class="bars">'+m.reasons.slice(0,6).map(([r,n])=>'<div class="brow"><span>'+esc(r)+'</span><span class="b"><i style="width:'+Math.max(6,Math.round(n*100/maxR))+'%"></i></span><span class="n">'+n+'</span></div>').join("")+'</div>' : '<div class="empty">近 7 天没有退回或问题记录。</div>';
  const ag = agentStats(S.tasks, 30);

/* ---------- receipt ---------- */
const RECEIPT_TEMPLATE = [
"## 交付回执（每次任务结束时必须输出）",
"任务结束时，在回复末尾输出下面格式的代码块，字段不要省略；不确定的写 unknown。",
"如果可以使用 agent-hub 的 MCP 工具，同时调用 submit_receipt 提交同样的内容。",
"",
"```agent-receipt",
"task: <任务编号，如 T260922-a1b>",
"status: done | blocked",
"summary: <一句话说明做了什么>",
"changed:",
"  - <改动的文件路径>",
"verify:",
"  - <执行的验证命令>: pass | fail",
"scope: ok | <超出任务范围的改动及原因>",
"risks: <已知风险或未完成事项，没有写 无>",
"session: <会话链接或编号>",
"minutes: <大约耗时，分钟>",
"ci_rounds: <CI 运行轮数>",
"```"].join("\n");
function parseReceipt(raw){
  let text = String(raw||"");
  const m = text.match(/```\s*agent-receipt\s*\n([\s\S]*?)```/i);
  if (m) text = m[1];
  const out = {}; let cur = null;
  text.split(/\r?\n/).forEach(line => {
    const clean = line.replace(/\s+#\s.*$/, "");
    if (!clean.trim()) return;
    const li = clean.match(/^\s*[-*]\s+(.*)$/);
    if (li && cur){ (out[cur] = Array.isArray(out[cur]) ? out[cur] : []).push(li[1].trim()); return; }
    const kv = clean.match(/^\s*([A-Za-z_]+)\s*[:：]\s*(.*)$/);
    if (kv){ cur = kv[1].toLowerCase(); const v = kv[2].trim(); out[cur] = v === "" ? [] : v; }
  });
  if (!out.task && !out.summary && !out.changed) return null;
  const list = v => Array.isArray(v) ? v : (v ? String(v).split(/[,，]\s*/).filter(Boolean) : []);
  const verify = list(out.verify).map(s => { const mm = s.match(/^(.*?)\s*[:：]\s*(pass|fail|通过|失败|ok|unknown)\s*$/i); return mm ? {cmd: mm[1].trim(), result: /pass|通过|ok/i.test(mm[2]) ? "pass" : /fail|失败/i.test(mm[2]) ? "fail" : "unknown"} : {cmd: s, result: "unknown"}; });
  const st = String(out.status||"").toLowerCase();
  return {
    task: typeof out.task==="string" ? out.task.replace(/[<>]/g,"").trim() : "",
    status: /block|阻塞|失败|fail/.test(st) ? "blocked" : "done",
    summary: typeof out.summary==="string" ? out.summary : "",
    changed: list(out.changed),
    verify,
    scope: typeof out.scope==="string" ? out.scope : "",
    risks: typeof out.risks==="string" ? out.risks : "",
    session: typeof out.session==="string" ? out.session : "",
    cost: num(out.cost), minutes: num(out.minutes), ciRounds: num(out.ci_rounds), lines: num(out.lines)
  };
}
function receiptPatch(t, r){
  const patch = { receipt: {summary:r.summary||"", changed:(r.changed||[]).slice(0,200), verify:(r.verify||[]).slice(0,50), scope:r.scope||"", risks:r.risks||"", at: nowIso()} };
  if (r.session && !/^unknown$/i.test(r.session)) patch.session = r.session;
  if (r.cost!=null) patch.cost = r.cost;
  if (r.minutes!=null) patch.minutes = r.minutes;
  if (r.ciRounds!=null) patch.ciRounds = r.ciRounds;
  if (r.lines!=null) patch.lines = r.lines;
  const bad = r.status==="blocked" || (r.verify||[]).some(v=>v.result==="fail");
  return {patch, to: bad ? "需介入" : "待评审"};
}
function scopeOk(s){ return !s || /^(ok|无|none|没有)$/i.test(String(s).trim()); }

function relevantRules(project){ return S.rules.filter(r => r.status!=="已废弃" && (!r.scope || r.scope==="全局" || r.scope===project)); }
function taskBrief(t){
  const L = [];
  L.push("# 任务 "+t.id+"："+(t.title||""));
  L.push("- 项目："+(t.project||"未指定")+" ｜ 风险等级："+(t.risk||"未定")+" ｜ 执行 Agent："+(t.agent||"未指定"));
  L.push("", "## 目标", t.goal || "（待补充）");
  L.push("", "## 验收标准（每条都要可验证）");
  (t.acceptance||[]).length ? t.acceptance.forEach(a=>L.push("- [ ] "+a.text)) : L.push("- [ ] （待补充）");
  L.push("", "## 范围", "- 允许修改："+(t.allow||"未限定"), "- 禁止修改："+(t.deny||"无额外限制"));
  if (t.spec) L.push("", "## 规格", t.spec);
  L.push("", "## 预算", "- 时长 ≤ "+(t.budgetMin||60)+" 分钟；验证最多修 3 轮。超出时停止，并在回执中说明原因。");
  const pj = projByName(t.project);
  if (pj && !(pj.onboard||{}).kit){ const inv = lines(pj.invariants).concat(lines(pj.forbidden)); if (inv.length){ L.push("", "## 项目约束"); inv.forEach(x=>L.push("- "+x)); } if (lines(pj.verify).length){ L.push("", "## 验证命令"); lines(pj.verify).forEach(x=>L.push("- `"+x+"`")); } }
  if ((t.reworks||[]).length){ const r=t.reworks[t.reworks.length-1]; L.push("", "## 上次评审退回（请先处理）", "- 原因："+(r.reasons||[]).join("、")); if (r.note) L.push("- 说明："+r.note); }
  L.push("", "## 工作方式", "- 在当前分支和目录中工作，不要切换、合并或删除分支", "- 提交信息末尾带 `Task: "+t.id+"`（git 钩子会自动补）", "- 阶段性进展：`bash scripts/agent/hub.sh progress <0-100> \"<当前步骤>\"`，或 agent-hub MCP 的 report_progress");
  const pend = relevantRules(t.project).filter(r=>r.status==="待写入" || !(pj && (pj.onboard||{}).kit));
  if (pend.length){ L.push("", "## 额外规则（尚未写入规则文件）"); pend.forEach(r=>L.push("- "+r.text)); }
  L.push("", "## 完成后", "按 AGENTS.md 中的“交付回执”格式输出回执，task 填 "+t.id+"；能用 agent-hub MCP 时同时调用 submit_receipt。若没有该格式，使用：", "", RECEIPT_TEMPLATE.split("\n").slice(4).join("\n"));
  return L.join("\n");
}

  const pend = by("待写入"), done = by("已写入"), dead = by("已废弃");

  '</div></div>';

function rulesSnippet(){
  const live = S.rules.filter(r=>r.status!=="已废弃");
  const groups = {};
  live.forEach(r=>{ const k=(r.target||"AGENTS.md")+"｜"+(r.scope||"全局"); (groups[k]=groups[k]||[]).push(r); });
  const L = ["<!-- 由 Agent 工作台生成："+new Date().toLocaleString("zh-CN")+" -->"];
  Object.keys(groups).sort().forEach(k=>{ const [target,scope]=k.split("｜"); L.push("", "## "+target+" · "+scope); groups[k].forEach(r=>L.push("- "+r.text+(r.status==="待写入"?"  <!-- 新增 -->":""))); });
  return L.join("\n");
}

function taskToMd(t){

  const fm = [
    "id: "+y(t.id), "title: "+y(t.title), "aliases: "+JSON.stringify([t.title||t.id]),
    "project: "+y(t.project), "agent: "+y(t.agent), "risk: "+y(t.risk), "status: "+y(t.status),
    "created: "+localDt(t.createdAt), "started: "+localDt(t.startedAt), "done: "+localDt(t.doneAt),
    "cost: "+(num(t.cost)??""), "minutes: "+(num(t.minutes)??""), "ci_rounds: "+(num(t.ciRounds)??""), "lines: "+(num(t.lines)??""),
    "rework: "+(t.reworks||[]).length, "first_pass: "+(t.status==="已合并" ? String(!(t.reworks||[]).length) : ""),
    "reasons: "+JSON.stringify(reasons), "branch: "+y(t.branch), "pr: "+y(t.pr), "session: "+y(t.session), "spec: "+y(t.spec),
    "tags: [agent-task]"
  ];
  const L = ["---"].concat(fm, ["---", "# "+(t.title||t.id), "",
    "> [!info] 工作台同步", "> 本笔记由 Agent 工作台导出，重新导出会覆盖。自己的想法请写在单独的笔记里，并链接 [["+t.id+"]]。", "",
    "## 目标", t.goal||"—", "", "## 验收标准"]);
  (t.acceptance||[]).length ? t.acceptance.forEach(a=>L.push("- ["+(a.done?"x":" ")+"] "+a.text)) : L.push("—");
  L.push("", "## 范围与预算", "- 允许修改："+(t.allow||"—"), "- 禁止修改："+(t.deny||"—"), "- 时长预算："+(t.budgetMin?t.budgetMin+" 分钟":"—"));
  const rc = t.receipt;
  L.push("", "## 交付回执");
  if (rc){ L.push(rc.summary||"—"); (rc.verify||[]).forEach(v=>L.push("- "+(v.result==="pass"?"通过":v.result==="fail"?"失败":"未知")+"：`"+v.cmd+"`"));
    if ((rc.changed||[]).length){ L.push("", "改动文件：", "```", ...rc.changed, "```"); }
    L.push("", "- 范围："+(rc.scope||"—"), "- 风险："+(rc.risks||"—")); } else L.push("—");
  L.push("", "## 评审记录");
  (t.reworks||[]).forEach((r,i)=>L.push("- 第 "+(i+1)+" 次退回（"+localDt(r.at)+"）："+(r.reasons||[]).join("、")+(r.note?" — "+r.note:"")));
  if (t.review) L.push("- 合并（"+localDt(t.review.at)+"）："+(t.review.firstPass?"一次通过":"经过退回")+((t.review.reasons||[]).length?"；问题："+t.review.reasons.join("、"):"")+(t.review.note?" — "+t.review.note:""));
  if (t.dropReason) L.push("- 放弃："+t.dropReason+(t.dropNote?" — "+t.dropNote:""));
  if (!(t.reworks||[]).length && !t.review && !t.dropReason) L.push("—");
  L.push("", "## 状态历史"); (t.history||[]).forEach(h=>L.push("- "+localDt(h.at)+" "+(h.from||"—")+" → "+h.to)); L.push("- "+localDt(t.createdAt)+" 创建");
  return L.join("\n")+"\n";
}
function ruleToMd(r){

function retroToMd(r){
  const [yy, ww] = String(r.id).split("-W"); let s = null;
  try { const jan4 = new Date(Number(yy),0,4); const d0 = (jan4.getDay()+6)%7; s = new Date(Number(yy),0,4-d0+(Number(ww)-1)*7); } catch(e){}
  const L = ["---","week: "+y(r.id),"updated: "+localDt(r.updatedAt),"tags: [agent-retro]","---","# 复盘 "+r.id,""];
  if (s && !isNaN(s)){ const e = new Date(s); e.setDate(s.getDate()+7); const m = metrics(S.tasks, s, e);
    L.push("| 新建 | 合并 | 放弃 | 合并率 | 一次通过率 | 总成本 |","|---|---|---|---|---|---|","| "+[m.created.length,m.merged.length,m.dropped.length,pct(m.merged.length,m.finished.length),pct(m.firstPass.length,m.merged.length),money(m.cost)].join(" | ")+" |","");
    if (m.reasons.length) L.push("问题归因："+m.reasons.map(([k,n])=>k+" "+n).join("，"),"");
    const rel = S.tasks.filter(t=>inRange(t.doneAt,s,e)||(t.reworks||[]).some(x=>inRange(x.at,s,e)));
    if (rel.length){ L.push("## 相关任务"); rel.forEach(t=>L.push("- [["+t.id+"|"+(t.title||t.id)+"]] · "+t.status+" · "+(t.agent||""))); L.push(""); } }
  L.push("## 本周观察", r.notes||"—", "", "## 下周行动", r.actions||"—", "");
  return L.join("\n");
}

async function buildExport(includeAll){
  const cutoff = Date.now()-30*86400000;
  const tasks = S.tasks.filter(t => includeAll || OPEN.includes(t.status) || new Date(t.doneAt||t.updatedAt||t.createdAt).getTime()>=cutoff);
  if (!window.JSZip){
    const parts = tasks.map(taskToMd).concat(S.rules.map(ruleToMd), Object.values(S.retros).map(retroToMd));
    return {filename:"Agent工作台-合并导出.md", data: parts.join("\n\n---\n\n")};
  }
  const zip = new JSZip(); const root = zip.folder("Agent工作台");
  tasks.forEach(t=>root.file("任务/"+fileSafe(t.id)+".md", taskToMd(t)));
  S.rules.forEach(r=>root.file("规则/"+fileSafe(r.id)+".md", ruleToMd(r)));
  Object.values(S.retros).forEach(r=>root.file("复盘/"+fileSafe(r.id)+".md", retroToMd(r)));
  root.file("任务看板.base", TASK_BASE); root.file("规则库.base", RULE_BASE);
  root.file("AGENTS-规则片段.md", rulesSnippet()+"\n"); root.file("README.md", readmeMd());
  const d = new Date(); const stamp = d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
  return {filename:"Agent工作台-"+stamp+".zip", data: await zip.generateAsync({type:"blob"})};
}

function normReceipt(o){

  return { task: o.task ? String(o.task) : "", status: /block/i.test(String(o.status||"")) ? "blocked" : "done", summary: String(o.summary||""), changed: arr(o.changed),
    verify: Array.isArray(o.verify) ? o.verify.map(v=>({cmd:String(v&&v.cmd||v||""), result:["pass","fail"].includes(v&&v.result)?v.result:"unknown"})).filter(v=>v.cmd) : [],
    scope: String(o.scope||""), risks: String(o.risks||""), session: o.session ? String(o.session) : "", cost: num(o.cost), minutes: num(o.minutes), ciRounds: num(o.ci_rounds), lines: num(o.lines) };

function recentProblems(days){
  const since = Date.now()-days*86400000; const out = [];
  S.tasks.forEach(t=>{
    (t.reworks||[]).forEach(r=>{ if(new Date(r.at).getTime()>=since) out.push({task:t.title, project:t.project||"", agent:t.agent||"", kind:"退回", reasons:r.reasons||[], note:r.note||""}); });
    if (t.review && new Date(t.review.at).getTime()>=since && ((t.review.reasons||[]).length||t.review.note)) out.push({task:t.title, project:t.project||"", agent:t.agent||"", kind:"合并时问题", reasons:t.review.reasons||[], note:t.review.note||""});
    if (t.status==="已放弃" && t.doneAt && new Date(t.doneAt).getTime()>=since) out.push({task:t.title, project:t.project||"", agent:t.agent||"", kind:"放弃", reasons:t.dropReason?[t.dropReason]:[], note:t.dropNote||""});
  });
  return out.slice(0,80);
}

const NUMF = ["budgetMin","cost","minutes","ciRounds","lines"];
document.addEventListener("click", e => {

document.addEventListener("change", e => {
  const el = e.target;
  if (S.dispatch && el.name==="dp-mode"){ S.dispatch.mode = el.value; render(); return; }
  if (S.dispatch && el.id==="dp-runner"){ S.dispatch.runner = el.value; S.dispatch.agent = ""; render(); return; }
  if (S.dispatch && el.id==="dp-agent"){ S.dispatch.agent = el.value; return; }
  if (el.dataset.act==="filter"){ S.filter[el.dataset.k] = el.type==="checkbox" ? el.checked : el.value; render(); return; }
  if (el.dataset.act==="acc-toggle"){ const t = getTask(S.openId); if (!t) return; const acc = (t.acceptance||[]).map((a,i)=> i===+el.dataset.i ? Object.assign({}, a, {done: el.checked}) : a); patchTask(t.id, {acceptance: acc}); return; }
  if (el.dataset.act==="onboard"){ const i = +el.dataset.i; const ps = S.config.projects.map((p,j)=> j===i ? Object.assign({}, p, {onboard: Object.assign({}, p.onboard||{}, {[el.dataset.k]: el.checked})}) : p); saveConfig({projects: ps}); return; }
  if (el.name==="n-risk"){ const tip = $("#n-risk-tip"); if (tip) tip.textContent = RISK_TIP[el.value]||""; return; }
  if (el.id==="imp-file" && el.files && el.files[0]){ importJson(el.files[0]); el.value = ""; return; }
  if (el.dataset.f && S.openId){ const t = getTask(S.openId); if (!t) return; const f = el.dataset.f; let v = el.value;
    if (NUMF.includes(f)) v = num(v); else v = String(v).trim();
    if (f==="title" && !v){ el.value = t.title||""; toast("标题不能为空"); return; }
    if (t[f] !== v) patchTask(t.id, f==="cost" ? {cost: v, costManual: v!=null} : {[f]: v}); }
});
document.addEventListener("input", e => { const el = e.target; if (el.dataset.act==="filter" && el.type==="search"){ S.filter.q = el.value; render(); } });
document.addEventListener("keydown", e => {
  if (e.key==="Escape"){ if (modalEl) closeModal(); else if (S.dispatch){ S.dispatch = null; render(); } else if (S.openId) closeDrawer(); return; }
  const tg = e.target;
  if (e.metaKey || e.ctrlKey || e.altKey || modalEl || (tg && (tg.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)))) return;
  if (e.key==="n" || e.key==="N"){ e.preventDefault(); A["new-task"](); }
  else if (e.key==="/"){ e.preventDefault(); if (S.tab!=="board") A.tab({dataset:{k:"board"}}); const q = $("#f-q"); if (q) q.focus(); }
  else if (e.key==="?"){ e.preventDefault(); showShortcuts(); }
  else if (/^[1-9]$/.test(e.key) && TABS[+e.key-1]){ e.preventDefault(); A.tab({dataset:{k:TABS[+e.key-1][0]}}); }

async function importJson(file){
  let data; try { data = JSON.parse(await file.text()); } catch(e){ toast("文件不是有效的 JSON"); return; }
  if (!data || data.app!=="agent-workbench"){ toast("这不是 Agent 工作台的备份文件"); return; }
  const tasks = Array.isArray(data.tasks)?data.tasks:[], rules = Array.isArray(data.rules)?data.rules:[], retros = Array.isArray(data.retros)?data.retros:[];
  toast("正在恢复 "+(tasks.length+rules.length+retros.length)+" 条记录…");
  try {
    if (data.config) await store.set("config","main", normalizeConfig(data.config));
    for (const t of tasks) if (t && t.id) await store.set("tasks", String(t.id), t);
    for (const r of rules) if (r && r.id) await store.set("rules", String(r.id), r);
    for (const r of retros) if (r && r.id) await store.set("retros", String(r.id), r);
    toast("恢复完成");
  } catch(e){ reportErr(e); }
}
function normalizeConfig(c){
  const agents = Array.isArray(c && c.agents) ? c.agents.map(String).filter(Boolean) : DEFAULT_AGENTS.slice();
  const L = v => Array.isArray(v) ? v.map(String).filter(Boolean) : [];
  const projects = Array.isArray(c && c.projects) ? c.projects.filter(p=>p&&p.name).map(p=>({name:String(p.name), path:String(p.path||p.repo||""), stage:String(p.stage||"开发中"), stack:String(p.stack||""), docs:String(p.docs||""),
    verify:L(p.verify), invariants:L(p.invariants), forbidden:L(p.forbidden), protect:L(p.protect), onboard:(p.onboard&&typeof p.onboard==="object")?p.onboard:{}, ruleFiles:(p.ruleFiles&&typeof p.ruleFiles==="object")?p.ruleFiles:{}})) : [];
  return {agents, projects};
}

};
const stallMs = () => ((S.hub.caps && S.hub.caps.exec && S.hub.caps.exec.stallMinutes) || 15) * 60000;
const offlineMs = () => ((S.hub.caps && S.hub.caps.exec && S.hub.caps.exec.runnerOfflineSeconds) || 90) * 1000;
const isActive = r => !!(r && RUN_ACTIVE.includes(r.status));
function runnerOnline(r){ return !!(r && r.lastSeen && Date.now()-Date.parse(r.lastSeen) < offlineMs()); }
// 健康度随时间变化，前端按心跳重新计算：stalled 停滞、lost 执行端离线、waiting 指定的执行端不在线
function runHealth(run, live){
  if (!run) return "";
  if (!isActive(run)) return run.status;
  const rn = live && run.runner ? S.exec.runners.get(run.runner) : null;
  if (run.status==="queued") return live && run.runner && !runnerOnline(rn) ? "waiting" : "queued";
  if (live && run.mode==="exec" && run.runner && !runnerOnline(rn)) return "lost";
  const last = Date.parse(run.heartbeatAt||run.startedAt||run.claimedAt||run.createdAt||run.at)||0;
  return Date.now()-last > stallMs() ? "stalled" : run.status;
}
function liveRun(id){ const r = S.exec.runs.get(id); if (!r) return null; const rn = r.runner ? S.exec.runners.get(r.runner) : null; return Object.assign({}, r, {live:true, runnerName: rn ? rn.name : r.runnerName||"", health: runHealth(r, true)}); }

  const log = sy.conflictLog || [];
  return '<div class="panel syncbox">'+head+
    '<div class="meta"><div><span>对端</span>'+esc(sy.peer?sy.peer.name+(sy.peer.kind==="cloud"?"（云端）":"（本地）"):sy.url)+'</div><div><span>地址</span><span class="mono small" title="'+esc(sy.url)+'">'+esc(sy.url)+'</span></div><div><span>方式</span>'+esc(SYNC_MODE[sy.mode]||sy.mode)+'</div><div><span>自动同步</span>'+(sy.interval?"每 "+sy.interval+" 秒":"只手动")+'</div></div>'+
    '<p class="small" style="margin:0"><span class="'+(sy.last&&!l.ok?"bad":"muted")+'">最近一次：'+esc(lastTxt)+'</span>'+(sy.last&&!l.ok?'<br><span class="bad">'+esc(l.error||"")+'</span>':'')+(sy.pending?'<br><span class="muted">'+sy.pending+' 个文档等待下一轮重试</span>':'')+'</p>'+
    '<div class="btns"><button class="btn pri sm" data-act="sync-run"'+(S.syncBusy?" disabled":"")+'>'+(S.syncBusy==="run"?"同步中…":"立即同步")+'</button><button class="btn sm" data-act="sync-preview"'+(S.syncBusy?" disabled":"")+'>'+(S.syncBusy==="preview"?"计算中…":"预览")+'</button></div>'+
    (pv?'<div class="small" style="padding:8px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line)">预览（未写入）：将拉取 <b>'+pv.pull+'</b> 个、推送 <b>'+pv.push+'</b> 个文档'+(pv.conflicts.length?'，<span class="bad">'+pv.conflicts.length+' 个两端都改过，会合并</span>':'，没有冲突')+'。</div>':'')+
    (log.length?'<div><div class="small" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b>冲突记录（'+log.length+'）</b><button class="btn ghost sm" data-act="sync-clear">清除</button></div><ul class="conflicts">'+log.slice(0,10).map(c=>'<li><div>'+(c.coll==="tasks"&&getTask(c.id)?'<a href="#" data-act="open" data-id="'+esc(c.id)+'">'+esc(c.title||c.id)+'</a>':esc(c.title||(c.coll==="config"?"设置（项目与 Agent 列表）":c.coll+"/"+c.id)))+' <span class="muted mono small">'+esc(fmtDate(c.at))+'</span></div><div class="small muted">'+esc(c.note)+'</div></li>').join("")+'</ul></div>':'')+
  '</div>';
}
function renderHub(){
  const h = S.hub.caps && S.hub.caps.hub; const el = $("#hubtag");
  if (h){
    const c = h.kind==="cloud";
    const html = '<span class="hubtag '+(c?"cloud":"local")+'" title="当前打开的是'+(c?"云端":"本地")+' Hub：'+esc(h.name)+(h.retiredTo?"（已停用，只读）":"")+'">'+(c?ICON.cloud:ICON.local)+esc(h.name)+(h.retiredTo?" · 已停用":"")+'</span>';
    if (el.innerHTML !== html) el.innerHTML = html;
    document.title = "Agent 工作台 · "+h.name;
  }
  const sy = S.sync; const sc = $("#syncchip"); let html = "";
  if (sy && sy.configured){
    const l = sy.last; const bad = l && !l.ok; const cf = sy.conflicts || (sy.conflictLog||[]).length;
    html = '<button class="chipbtn hide-sm '+(bad?"bad":cf?"warn":"ok")+'" data-act="go-sync" title="'+esc(bad ? "同步失败："+(l.error||"") : "与「"+(sy.peer&&sy.peer.name||sy.url)+"」"+(SYNC_MODE[sy.mode]||""))+'"><i></i>'+(bad?"同步失败":cf?"已同步 · 冲突 "+cf:"已同步 · "+(sy.lastOk?ago(sy.lastOk):"未开始"))+'</button>';
  }
  if (sc.innerHTML !== html) sc.innerHTML = html;
}
function showShortcuts(){
  closeModal(); modalEl = document.createElement("div"); modalEl.className = "modal";
  const rows = [["N","新建任务"],["/","搜索任务（看板）"],["1 – 9","切换页面"],["Esc","关闭详情 / 弹窗"],["?","显示这个列表"]];
  modalEl.innerHTML = '<div class="box" role="dialog" aria-modal="true" aria-label="快捷键" style="width:min(380px,100%)"><header>快捷键</header><div><table><tbody>'+rows.map(([k,v])=>'<tr><td><span class="kbd">'+esc(k)+'</span></td><td>'+esc(v)+'</td></tr>').join("")+'</tbody></table></div><footer class="btns"><button class="btn ghost" data-act="modal-close">关闭</button></footer></div>';
  document.body.appendChild(modalEl);
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  $("[data-act=modal-close]", modalEl).focus();
}

/* ---------- boot ---------- */
const VIEWS = {today: viewToday, board: viewBoard, exec: viewExec, projects: viewProjects, agents: viewAgents, capture: viewCapture, rules: viewRules, retro: viewRetro, export: viewExport};
let raf = 0; function scheduleRender(){ if (raf) return; raf = requestAnimationFrame(()=>{ raf = 0; render(); }); }
function subErr(e){ if (e && e.code==="revoked"){ S.mode="local"; } scheduleRender(); }
async function init(){
  render();
  if (!window.claude || typeof window.claude.use !== "function"){ S.mode = "local"; render(); return; }
  const use = n => window.claude.use(n).catch(()=>null);
  const [db, dl, sm] = await Promise.all([use("db"), use("downloads"), use("sample")]);
  S.cap.downloads = dl; S.cap.sample = sm;
  if (!db){ S.mode = "local"; render(); return; }
  S.cap.db = db; S.mode = "db";
  db.collection("tasks").onSnapshot(s => { S.tasks = s.docs.map(d=>Object.assign({}, d.data(), {id:d.id})); S.loaded.tasks = true; scheduleRender(); }, subErr);
  db.collection("rules").onSnapshot(s => { S.rules = s.docs.map(d=>Object.assign({}, d.data(), {id:d.id})); S.loaded.rules = true; scheduleRender(); }, subErr);
  db.collection("retros").onSnapshot(s => { const o = {}; s.docs.forEach(d=>{ o[d.id] = Object.assign({}, d.data(), {id:d.id}); }); S.retros = o; S.loaded.retros = true; scheduleRender(); }, subErr);
  db.doc("config/main").onSnapshot(d => { if (d.exists) S.config = normalizeConfig(d.data()); S.loaded.config = true; scheduleRender(); }, subErr);
  try { S.hub.caps = await hub.caps(); } catch(e){}
  renderHub(); loadExec(); loadSync();
  loadFeed();
  if (S.tab==="agents") refreshStatus();
  window.addEventListener("hub:event", e => {
    const ev = e.detail; if (!ev) return;
    S.hub.feed.unshift(ev); S.hub.feed = S.hub.feed.slice(0, 60);
    if (ev.task && S.hub.activity[ev.task] && !S.hub.activity[ev.task].loading) S.hub.activity[ev.task].events.unshift(ev);
    if (ev.task && S.openId===ev.task && /^(session|receipt|check)/.test(ev.kind)) loadActivity(ev.task);
    if (S.tab==="today" || S.tab==="agents" || (S.openId && S.openId===ev.task)) scheduleRender();
  });
  window.addEventListener("hub:online", e => { if (S.hub.online !== e.detail){ S.hub.online = e.detail; scheduleRender(); } });
  window.addEventListener("hub:run", e => onRun(e.detail));
  window.addEventListener("hub:runner", e => onRunner(e.detail));
  window.addEventListener("hub:sync", () => loadSync());
  window.addEventListener("hub:reconnect", () => { loadExec(); loadSync(); });
  // 接入状态只在“接入”页、页面可见时刷新（避免后台标签页持续产生查询）
  setInterval(() => { if (S.tab==="agents" && !document.hidden) refreshStatus(); }, 60000);
  // 心跳、停滞、“几分钟前”都随时间变化：每 30 秒刷新一次（输入框内容和焦点会保留）
  setInterval(() => { if (!document.hidden && !modalEl) scheduleRender(); }, 30000);
  render();
}
init();
})();
</script>
